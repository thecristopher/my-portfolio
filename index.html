    <script>
      // pick the theme before paint so there's no flash of the wrong one: the toggle's choice wins, otherwise the
      // system decides. keep in step with resolveTheme in src/lib/theme.js
      try {
        var saved = localStorage.getItem("theme");
        var theme = saved === "light" || saved === "dark" ? saved : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "dark" ? "#000000" : "#fbfbfd");
      } catch (error) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
