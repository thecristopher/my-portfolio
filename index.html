    <script>
      // pick the region before paint so there's no flash of the default one. same rules as Eldentree in nvim:
      // a pinned region always wins, the first visit wakes up in leyndell, and every visit after that rolls a
      // region you didn't see last time. keep in step with startingRegion in src/lib/regions.js
      try {
        var regions = ["leyndell", "haligtree", "raya-lucaria", "caelid", "mohgwyn", "ordina"];
        var pinned = localStorage.getItem("region-pinned");
        var last = localStorage.getItem("region-last");
        var region = "leyndell";
        if (regions.indexOf(pinned) !== -1) region = pinned;
        else if (regions.indexOf(last) !== -1) {
          var others = regions.filter(function (name) { return name !== last; });
          region = others[Math.floor(Math.random() * others.length)];
        }
        localStorage.setItem("region-last", region);
        document.documentElement.dataset.theme = region;
      } catch (error) {
        document.documentElement.dataset.theme = "leyndell";
      }
    </script>
